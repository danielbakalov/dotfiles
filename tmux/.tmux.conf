unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g automatic-rename off

set -g set-titles on
set -g set-titles-string "#S · #{b:pane_current_path}"

set -s escape-time 0
set -g status-interval 5

set -g status-position top
set -g status-style "bg=#181616,fg=#c5c9c5"
set -g status-left "#[bg=#8a9a7b,fg=#181616,bold] #S #[default] "
set -g status-right ""
set -g status-left-length 30
set -g status-right-length 30
set -g window-status-format "#[fg=#737c73] #I:#{b:pane_current_path} "
set -g window-status-current-format "#[bg=#2D4F67,fg=#c5c9c5,bold] #I:#{b:pane_current_path} "
set -g pane-border-style "fg=#393836"
set -g pane-active-border-style "fg=#8a9a7b"
set -g message-style "bg=#282727,fg=#c5c9c5"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
